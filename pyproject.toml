[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mediatrack-forge"
dynamic = ["version"]
description = "Windows-first media track manager: development foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["customtkinter==6.0.0"]

[project.scripts]
mediatrack-forge = "mediatrack_forge.ui.cli:main"

[project.gui-scripts]
mediatrack-forge-desktop = "mediatrack_forge.ui.desktop:main"

[tool.setuptools.dynamic]
version = {attr = "mediatrack_forge.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mediatrack_forge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra --strict-config --strict-markers"
markers = ["integration: real FFmpeg/ffprobe tests with synthetic local media; tools required"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["customtkinter"]
ignore_missing_imports = true
